<svg xmlns='http://www.w3.org/2000/svg' width='1120' height='740' viewBox='0 0 1120 740' font-family='Arial'><defs><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto-start-reverse'><path d='M0 0v6l9-3z' fill='context-stroke'/></marker></defs><rect width='1120' height='740' fill='#f5f7fb'/><text x='40' y='52' font-size='28' font-weight='700' fill='#102a43'>SENTINELA · Arquitetura</text><rect x='40' y='110' width='250' height='160' rx='14' fill='#e6fffa' stroke='#94a3b8' stroke-width='2'/><text x='56' y='142' font-size='18' font-weight='700' fill='#102a43'>Microfone GY-MAX9814</text><text x='56' y='172' font-size='15' fill='#334e68'>Eletreto + AGC, ganho 40 dB</text><text x='56' y='196' font-size='15' fill='#334e68'>Saída analógica OUT</text><text x='56' y='220' font-size='15' fill='#334e68'>-&gt; GPIO34 (ADC1_CH6)</text><rect x='380' y='90' width='360' height='250' rx='14' fill='#ffffff' stroke='#94a3b8' stroke-width='2'/><text x='396' y='122' font-size='18' font-weight='700' fill='#102a43'>ESP32 DevKit v1 (servidor)</text><text x='396' y='152' font-size='15' fill='#334e68'>Wi-Fi Access Point "SENTINELA"</text><text x='396' y='176' font-size='15' fill='#334e68'>IP 192.168.4.1 · HTTP porta 80</text><text x='396' y='200' font-size='15' fill='#334e68'>Captura 16 kHz: timer + tarefa no núcleo 1</text><text x='396' y='224' font-size='15' fill='#334e68'>Buffer circular de ~2 s (64 KB)</text><text x='396' y='248' font-size='15' fill='#334e68'>GET /status /sensor /audio.wav</text><text x='396' y='272' font-size='15' fill='#334e68'>GET /atuador /config · CORS</text><rect x='830' y='110' width='250' height='160' rx='14' fill='#fffaf0' stroke='#94a3b8' stroke-width='2'/><text x='846' y='142' font-size='18' font-weight='700' fill='#102a43'>Atuadores</text><text x='846' y='172' font-size='15' fill='#334e68'>LED verde · GPIO16</text><text x='846' y='196' font-size='15' fill='#334e68'>LED vermelho · GPIO17</text><text x='846' y='220' font-size='15' fill='#334e68'>Buzzer (NPN) · GPIO18</text><text x='846' y='244' font-size='15' fill='#334e68'>LED azul onboard · GPIO2</text><rect x='40' y='430' width='1040' height='230' rx='14' fill='#ebf8ff' stroke='#94a3b8' stroke-width='2'/><text x='56' y='462' font-size='18' font-weight='700' fill='#102a43'>Notebook (conectado ao Wi-Fi SENTINELA, sem internet)</text><rect x='70' y='480' width='430' height='160' rx='14' fill='#ffffff' stroke='#94a3b8' stroke-width='2'/><text x='86' y='512' font-size='18' font-weight='700' fill='#102a43'>Dashboard (navegador, JS puro)</text><text x='86' y='542' font-size='15' fill='#334e68'>Polling de 1 s: /status e /sensor</text><text x='86' y='566' font-size='15' fill='#334e68'>Selo conectado/desconectado, gráficos</text><text x='86' y='590' font-size='15' fill='#334e68'>Botões Normal / Alerta / Buzzer / Teste</text><text x='86' y='614' font-size='15' fill='#334e68'>Funciona SEM o serviço de IA</text><rect x='620' y='480' width='430' height='160' rx='14' fill='#ffffff' stroke='#94a3b8' stroke-width='2'/><text x='636' y='512' font-size='18' font-weight='700' fill='#102a43'>Serviço de IA (Python, localhost:5000)</text><text x='636' y='542' font-size='15' fill='#334e68'>Puxa /audio.wav a cada ~1 s</text><text x='636' y='566' font-size='15' fill='#334e68'>YAMNet -&gt; porteiro "é carro?"</text><text x='636' y='590' font-size='15' fill='#334e68'>-&gt; diagnóstico (5 classes)</text><text x='636' y='614' font-size='15' fill='#334e68'>Comanda /atuador; serve o dashboard</text><line x1='290' y1='190' x2='372' y2='190' stroke='#0f766e' stroke-width='3' marker-end='url(#m)'/><text x='339' y='182' font-size='13' fill='#243b53'>áudio</text><line x1='740' y1='190' x2='822' y2='190' stroke='#d97706' stroke-width='3' marker-end='url(#m)'/><text x='789' y='182' font-size='13' fill='#243b53'>GPIO</text><line x1='285' y1='472' x2='470' y2='348' stroke='#2563eb' stroke-width='3' marker-end='url(#m)' marker-start='url(#m)'/><text x='386' y='402' font-size='13' fill='#243b53'>HTTP GET</text><line x1='835' y1='472' x2='650' y2='348' stroke='#7c3aed' stroke-width='3' marker-end='url(#m)' marker-start='url(#m)'/><text x='750' y='402' font-size='13' fill='#243b53'>/audio.wav, /atuador</text><line x1='508' y1='560' x2='612' y2='560' stroke='#475569' stroke-width='3' marker-end='url(#m)' marker-start='url(#m)'/><text x='568' y='552' font-size='13' fill='#243b53'>/api</text><text x='40' y='720' font-size='14' fill='#486581'>Núcleo obrigatório = ESP32 + dashboard por HTTP. A IA é um diferencial: se ela cair, o resto continua funcionando.</text></svg>