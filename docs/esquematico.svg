<svg xmlns='http://www.w3.org/2000/svg' width='1140' height='600' viewBox='0 0 1140 600' font-family='Arial'><defs><marker id='m' markerWidth='10' markerHeight='10' refX='8' refY='3' orient='auto-start-reverse'><path d='M0 0v6l9-3z' fill='context-stroke'/></marker></defs><rect width='1140' height='600' fill='#f5f7fb'/><text x='40' y='52' font-size='28' font-weight='700' fill='#102a43'>SENTINELA · Ligações (esquemático)</text><rect x='420' y='100' width='280' height='380' rx='14' fill='#ffffff' stroke='#94a3b8' stroke-width='2'/><text x='436' y='132' font-size='18' font-weight='700' fill='#102a43'>ESP32 DevKit v1</text><text x='436' y='162' font-size='15' fill='#334e68'>3V3  -&gt; MAX9814 e OLED</text><text x='436' y='186' font-size='15' fill='#334e68'>GND  -&gt; trilho de GND comum</text><text x='436' y='210' font-size='15' fill='#334e68'>GPIO34 &lt;- OUT do MAX9814</text><text x='436' y='234' font-size='15' fill='#334e68'>GPIO21 &lt;-&gt; SDA do OLED</text><text x='436' y='258' font-size='15' fill='#334e68'>GPIO22 -&gt; SCL do OLED</text><text x='436' y='282' font-size='15' fill='#334e68'>GPIO16 -&gt; LED verde</text><text x='436' y='306' font-size='15' fill='#334e68'>GPIO17 -&gt; LED vermelho</text><text x='436' y='330' font-size='15' fill='#334e68'>GPIO18 -&gt; base do NPN</text><text x='436' y='354' font-size='15' fill='#334e68'>VIN (5 V) -&gt; (+) do buzzer</text><text x='436' y='378' font-size='15' fill='#334e68'>GPIO2 = LED azul onboard</text><rect x='40' y='100' width='300' height='190' rx='14' fill='#e6fffa' stroke='#94a3b8' stroke-width='2'/><text x='56' y='132' font-size='18' font-weight='700' fill='#102a43'>GY-MAX9814 (sensor)</text><text x='56' y='162' font-size='15' fill='#334e68'>VDD  -&gt; 3V3 (nunca 5 V)</text><text x='56' y='186' font-size='15' fill='#334e68'>GND  -&gt; GND</text><text x='56' y='210' font-size='15' fill='#334e68'>OUT  -&gt; GPIO34</text><text x='56' y='234' font-size='15' fill='#334e68'>GAIN -&gt; VDD (40 dB fixo)</text><text x='56' y='258' font-size='15' fill='#334e68'>AR   -&gt; solto</text><rect x='40' y='320' width='300' height='170' rx='14' fill='#f5f3ff' stroke='#94a3b8' stroke-width='2'/><text x='56' y='352' font-size='18' font-weight='700' fill='#102a43'>OLED SSD1306 0,96" I2C (atuador)</text><text x='56' y='382' font-size='15' fill='#334e68'>VCC -&gt; 3V3</text><text x='56' y='406' font-size='15' fill='#334e68'>GND -&gt; GND</text><text x='56' y='430' font-size='15' fill='#334e68'>SDA -&gt; GPIO21</text><text x='56' y='454' font-size='15' fill='#334e68'>SCL -&gt; GPIO22</text><text x='56' y='478' font-size='15' fill='#334e68'>Endereço 0x3C (ou 0x3D)</text><rect x='780' y='90' width='320' height='150' rx='14' fill='#f0fff4' stroke='#94a3b8' stroke-width='2'/><text x='796' y='122' font-size='18' font-weight='700' fill='#102a43'>LEDs (5 mm)</text><text x='796' y='152' font-size='15' fill='#334e68'>GPIO16 -&gt; 220 Ω -&gt; ânodo verde</text><text x='796' y='176' font-size='15' fill='#334e68'>GPIO17 -&gt; 220 Ω -&gt; ânodo vermelho</text><text x='796' y='200' font-size='15' fill='#334e68'>cátodos (perna curta) -&gt; GND</text><rect x='780' y='270' width='320' height='190' rx='14' fill='#fffaf0' stroke='#94a3b8' stroke-width='2'/><text x='796' y='302' font-size='18' font-weight='700' fill='#102a43'>Buzzer ativo 5 V via NPN</text><text x='796' y='332' font-size='15' fill='#334e68'>GPIO18 -&gt; 1 kΩ -&gt; base</text><text x='796' y='356' font-size='15' fill='#334e68'>emissor -&gt; GND</text><text x='796' y='380' font-size='15' fill='#334e68'>coletor -&gt; (-) do buzzer</text><text x='796' y='404' font-size='15' fill='#334e68'>(+) do buzzer -&gt; VIN (5 V)</text><text x='796' y='428' font-size='15' fill='#334e68'>BC548: C-B-E · 2N2222: E-B-C</text><line x1='340' y1='195' x2='412' y2='195' stroke='#0f766e' stroke-width='3' marker-end='url(#m)'/><text x='384' y='187' font-size='13' fill='#243b53'>OUT</text><line x1='340' y1='405' x2='412' y2='405' stroke='#7c3aed' stroke-width='3' marker-end='url(#m)' marker-start='url(#m)'/><text x='384' y='397' font-size='13' fill='#243b53'>I2C 21/22</text><line x1='700' y1='165' x2='772' y2='165' stroke='#16a34a' stroke-width='3' marker-end='url(#m)'/><text x='744' y='157' font-size='13' fill='#243b53'>16/17</text><line x1='700' y1='360' x2='772' y2='360' stroke='#d97706' stroke-width='3' marker-end='url(#m)'/><text x='744' y='352' font-size='13' fill='#243b53'>18 / VIN</text><text x='40' y='558' font-size='14' fill='#486581'>Monte com o USB desligado. GND comum a todos os componentes. GPIO34 é só entrada e não pode passar de 3,3 V.</text><text x='40' y='580' font-size='14' fill='#486581'>A corrente do buzzer passa pelo transistor (não pelo GPIO). Pinagem do transistor: face reta para você, pernas para baixo.</text></svg>