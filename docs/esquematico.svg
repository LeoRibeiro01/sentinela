<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">
<defs><style>.t{font:700 28px Arial;fill:#102a43}.h{font:700 18px Arial;fill:#102a43}.b{font:16px Arial;fill:#334e68}.n{font:14px Arial;fill:#486581}.box{fill:#fff;stroke:#94a3b8;stroke-width:2}.wire{stroke:#0f766e;stroke-width:4;fill:none}.power{stroke:#d97706;stroke-width:4;fill:none}.gnd{stroke:#475569;stroke-width:4;fill:none}</style></defs>
<rect width="1100" height="580" fill="#f5f7fb"/><text x="50" y="58" class="t">Sentinela | Esquemático de ligações</text>
<rect x="50" y="150" width="260" height="210" rx="16" class="box"/><text x="85" y="190" class="h">GY-MAX9814</text><text x="85" y="230" class="b">OUT → GPIO 34</text><text x="85" y="265" class="b">VDD → 3V3</text><text x="85" y="300" class="b">GAIN → VDD (40 dB)</text><text x="85" y="335" class="b">GND → GND · AR solto</text>
<rect x="420" y="115" width="260" height="390" rx="18" class="box"/><text x="500" y="158" class="h">ESP32 DevKit v1</text><text x="455" y="225" class="b">GPIO 34 · ADC1</text><text x="455" y="290" class="b">GPIO 16 · LED verde</text><text x="455" y="335" class="b">GPIO 17 · LED vermelho</text><text x="455" y="380" class="b">GPIO 18 · buzzer ativo</text><text x="455" y="425" class="b">GPIO 2 · onboard alerta</text><text x="455" y="475" class="b">3V3 · GND</text>
<rect x="810" y="140" width="240" height="270" rx="16" class="box"/><text x="850" y="180" class="h">Atuadores</text><text x="835" y="225" class="b">GPIO 16 → 220Ω → LED</text><text x="835" y="265" class="b">GPIO 17 → 220Ω → LED</text><text x="835" y="305" class="b">Cátodos dos LEDs → GND</text><text x="835" y="350" class="b">GPIO 18 → driver → buzzer</text><text x="835" y="390" class="b">Terra comum</text>
<path d="M310 230h100" class="wire"/><path d="M310 265h65v210h35" class="power"/><path d="M310 335h50v140h50" class="gnd"/><path d="M680 290h120" class="wire"/><path d="M680 335h120" class="wire"/><path d="M680 380h120" class="power"/>
<rect x="50" y="430" width="310" height="90" rx="12" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/><text x="72" y="467" class="h">Atenção</text><text x="72" y="497" class="n">Sinal no GPIO34 limitado a 3,3 V.</text><text x="420" y="550" class="n">Buzzer/cargas exigem driver quando a corrente exceder o limite do GPIO.</text></svg>
